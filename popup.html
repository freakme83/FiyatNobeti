<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FiyatNöbeti</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>FiyatNöbeti</h1>
        <p class="intro">Amazon Türkiye fiyat takipçisi</p>
      </header>
      <form id="add-form">
        <label for="product-url">Amazon ürün bağlantısı</label>
        <input id="product-url" type="url" required spellcheck="false"
          placeholder="https://www.amazon.com.tr/dp/B0FZ9Y4GPF">
        <p id="short-link-notice" class="notice" role="note" aria-live="polite" hidden>
          Yalnızca Amazon uygulamasından veya sitesinden kendiniz kopyaladığınız, güvendiğiniz ürün bağlantılarını kullanın.
        </p>
        <button id="add-button" type="submit">Ürün ekle</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="watchlist-heading">
        <h2 id="watchlist-heading">İzleme listeniz</h2>
        <p id="empty-state" class="empty">Henüz ürün eklenmedi.</p>
        <ul id="products" aria-label="İzlenen ürünler"></ul>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
